server.error.include-message=never
server.error.include-binding-errors=never
spring.datasource.url=jdbc:h2:mem:db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.h2.console.enabled=false
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=always
spring.jpa.show-sql=false

spring.jpa.defer-datasource-initialization=true

logging.level.org.springframework.security=WARN

jwt.validity=${JWT_VALIDITY:3600}

jwt.secret=${JWT_SECRET}

# JavaMailSender configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3

security.login.max-failed-attempts=${LOGIN_MAX_FAILED_ATTEMPTS:5}
security.login.lock-duration-minutes=${LOGIN_LOCK_DURATION_MINUTES:10}
